<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>Competitive Exam Coach</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f5f7fb;
  color: #172033;
}
.app {
  max-width: 650px;
  margin: auto;
  min-height: 100vh;
  padding: 16px;
}
.header {
  background: #2563eb;
  color: white;
  padding: 24px;
  border-radius: 22px;
  margin-bottom: 18px;
  box-shadow: 0 8px 20px rgba(37,99,235,.2);
}
.header h1 {
  margin: 0 0 8px;
  font-size: 27px;
}
.header p {
  margin: 0;
  opacity: .9;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 18px;
  margin-bottom: 15px;
  box-shadow: 0 4px 14px rgba(0,0,0,.06);
}
.card h2 {
  margin-top: 0;
}
select {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #dbe2ea;
  margin: 8px 0 14px;
  font-size: 16px;
  background: white;
}
button {
  width: 100%;
  border: none;
  padding: 15px;
  margin-top: 10px;
  border-radius: 13px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  background: #2563eb;
  color: white;
}
button:disabled {
  cursor: default;
}
.secondary {
  background: #e8eefc;
  color: #1d4ed8;
}
.danger {
  background: #fee2e2;
  color: #991b1b;
}
.stats {
  display: flex;
  gap: 8px;
}
.stat {
  flex: 1;
  background: #f1f5ff;
  padding: 13px 5px;
  border-radius: 14px;
  text-align: center;
}
.stat strong {
  display: block;
  font-size: 21px;
  color: #2563eb;
}
.category {
  font-size: 13px;
  color: #64748b;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 8px;
}
.question {
  font-size: 19px;
  font-weight: 600;
  line-height: 1.5;
  margin-bottom: 15px;
}
.option {
  background: #f3f4f6;
  color: #172033;
  text-align: left;
}
.correct {
  background: #dcfce7 !important;
  color: #166534 !important;
}
.wrong {
  background: #fee2e2 !important;
  color: #991b1b !important;
}
.explanation {
  margin-top: 15px;
  padding: 14px;
  background: #f8fafc;
  border-left: 4px solid #2563eb;
  border-radius: 8px;
  line-height: 1.5;
}
.hidden {
  display: none;
}
.badge {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 20px;
  background: #eef2ff;
  color: #3730a3;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 10px;
}
.progress {
  height: 8px;
  background: #e5e7eb;
  border-radius: 20px;
  overflow: hidden;
  margin: 12px 0;
}
.progress-bar {
  height: 100%;
  width: 0%;
  background: #2563eb;
  transition: width .3s;
}
.result {
  text-align: center;
  font-size: 18px;
}
.small {
  color: #64748b;
  font-size: 14px;
}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <h1>📚 Competitive Exam Coach</h1>
  <p>Reasoning + Competitive English</p>
</div>
<!-- HOME -->
<div id="home">
  <div class="card">
    <h2>Choose Practice</h2>
    <label>Module</label>
    <select id="subject">
      <option value="Reasoning">🧠 Reasoning</option>
      <option value="English">📘 Competitive English</option>
    </select>
    <label>Topic</label>
    <select id="topic">
      <option value="All">All Topics</option>
    </select>
    <label>Difficulty</label>
    <select id="difficulty">
      <option value="All">All Levels</option>
      <option value="Easy">Easy</option>
      <option value="Medium">Medium</option>
      <option value="Hard">Hard</option>
    </select>
    <button onclick="startPractice()">
      🚀 Start Practice
    </button>
  </div>
  <div class="card">
    <h2>Your Progress</h2>
    <div class="stats">
      <div class="stat">
        <strong id="attempted">0</strong>
        Attempted
      </div>
      <div class="stat">
        <strong id="correct">0</strong>
        Correct
      </div>
      <div class="stat">
        <strong id="accuracy">0%</strong>
        Accuracy
      </div>
    </div>
    <button class="danger" onclick="resetProgress()">
      Reset Progress
    </button>
  </div>
</div>
<!-- QUIZ -->
<div id="quiz" class="hidden">
  <div class="card">
    <span id="badge" class="badge"></span>
    <div id="progressText" class="small"></div>
    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <div id="question" class="question"></div>
    <div id="options"></div>
    <div id="explanation" class="explanation hidden"></div>
    <button id="nextButton"
            class="hidden"
            onclick="nextQuestion()">
      Next Question →
    </button>
    <button class="secondary"
            onclick="goHome()">
      Exit Practice
    </button>
  </div>
</div>
<!-- RESULT -->
<div id="result" class="hidden">
  <div class="card result">
    <h2>🎯 Practice Completed</h2>
    <p id="resultMessage"></p>
    <div class="stats">
      <div class="stat">
        <strong id="resultTotal">0</strong>
        Questions
      </div>
      <div class="stat">
        <strong id="resultCorrect">0</strong>
        Correct
      </div>
      <div class="stat">
        <strong id="resultAccuracy">0%</strong>
        Accuracy
      </div>
    </div>
    <button onclick="goHome()">
      Practice Again
    </button>
  </div>
</div>
</div>
<script>
/* =====================================================
   QUESTION BANK
   =====================================================
   ADDITIONAL QUESTIONS CAN BE ADDED HERE.
   Each question has:
   subject
   category
   difficulty
   question
   options
   answer
   explanation
   answer is zero-based:
   0 = A
   1 = B
   2 = C
   3 = D
===================================================== */
const questions = [
/* =========================
   REASONING
========================= */
{
 subject:"Reasoning",
 category:"Analogy",
 difficulty:"Easy",
 question:"Book : Author :: Painting : ?",
 options:["Painter","Reader","Gallery","Paper"],
 answer:0,
 explanation:"An author creates a book, while a painter creates a painting."
},
{
 subject:"Reasoning",
 category:"Analogy",
 difficulty:"Easy",
 question:"Bird : Nest :: Bee : ?",
 options:["Hive","Burrow","Stable","Kennel"],
 answer:0,
 explanation:"A bird lives in a nest and a bee lives in a hive."
},
{
 subject:"Reasoning",
 category:"Analogy",
 difficulty:"Easy",
 question:"Eye : See :: Ear : ?",
 options:["Speak","Hear","Smell","Touch"],
 answer:1,
 explanation:"The eye is used for seeing and the ear is used for hearing."
},
{
 subject:"Reasoning",
 category:"Number Series",
 difficulty:"Medium",
 question:"2, 5, 10, 17, 26, ?",
 options:["35","36","37","38"],
 answer:2,
 explanation:"The differences are 3, 5, 7 and 9. The next difference is 11. Therefore 26 + 11 = 37."
},
{
 subject:"Reasoning",
 category:"Number Series",
 difficulty:"Easy",
 question:"3, 6, 12, 24, ?",
 options:["36","42","48","54"],
 answer:2,
 explanation:"Each number is multiplied by 2. Therefore 24 × 2 = 48."
},
{
 subject:"Reasoning",
 category:"Number Series",
 difficulty:"Easy",
 question:"81, 27, 9, 3, ?",
 options:["0","1","2","6"],
 answer:1,
 explanation:"Each number is divided by 3. Therefore 3 ÷ 3 = 1."
},
{
 subject:"Reasoning",
 category:"Classification",
 difficulty:"Easy",
 question:"Find the odd one out.",
 options:["Apple","Mango","Banana","Carrot"],
 answer:3,
 explanation:"Apple, mango and banana are fruits. Carrot is a vegetable."
},
{
 subject:"Reasoning",
 category:"Classification",
 difficulty:"Easy",
 question:"Find the odd one out.",
 options:["2","3","5","9"],
 answer:3,
 explanation:"2, 3 and 5 are prime numbers. 9 is composite."
},
{
 subject:"Reasoning",
 category:"Coding-Decoding",
 difficulty:"Medium",
 question:"If CAT is coded as DBU, how is DOG coded?",
 options:["EPH","EOG","FPH","DPH"],
 answer:0,
 explanation:"Each letter is moved one position forward: D→E, O→P and G→H. Therefore DOG becomes EPH."
},
{
 subject:"Reasoning",
 category:"Coding-Decoding",
 difficulty:"Medium",
 question:"If PEN is coded as QFO, how is MAP coded?",
 options:["NBQ","NBO","MBQ","OBQ"],
 answer:0,
 explanation:"Each letter moves one position forward: M→N, A→B and P→Q."
},
{
 subject:"Reasoning",
 category:"Blood Relations",
 difficulty:"Medium",
 question:"Ravi is the brother of Sita. Sita is the mother of Arun. Ravi is Arun's?",
 options:["Father","Uncle","Brother","Grandfather"],
 answer:1,
 explanation:"Ravi is Sita's brother. Sita is Arun's mother. Therefore Ravi is Arun's maternal uncle."
},
{
 subject:"Reasoning",
 category:"Blood Relations",
 difficulty:"Medium",
 question:"A is B's father. C is A's mother. C is B's?",
 options:["Mother","Aunt","Grandmother","Sister"],
 answer:2,
 explanation:"C is the mother of B's father, so C is B's grandmother."
},
{
 subject:"Reasoning",
 category:"Direction Sense",
 difficulty:"Easy",
 question:"Facing north, you turn right. Which direction are you facing?",
 options:["West","East","South","North"],
 answer:1,
 explanation:"A right turn from north points east."
},
{
 subject:"Reasoning",
 category:"Direction Sense",
 difficulty:"Easy",
 question:"Facing east, you turn left. Which direction are you facing?",
 options:["North","South","West","East"],
 answer:0,
 explanation:"A left turn from east points north."
},
{
 subject:"Reasoning",
 category:"Ranking",
 difficulty:"Easy",
 question:"In a class of 40 students, Ravi is 12th from the top. What is his rank from the bottom?",
 options:["28th","29th","30th","31st"],
 answer:1,
 explanation:"Rank from bottom = Total − rank from top + 1 = 40 − 12 + 1 = 29."
},
{
 subject:"Reasoning",
 category:"Ranking",
 difficulty:"Easy",
 question:"A is 15th from the top and 18th from the bottom. How many students are there?",
 options:["31","32","33","34"],
 answer:1,
 explanation:"Total = 15 + 18 − 1 = 32."
},
{
 subject:"Reasoning",
 category:"Syllogism",
 difficulty:"Medium",
 question:"All cats are animals. All animals are living beings. Therefore, all cats are living beings.",
 options:["Follows","Does not follow","Either","Cannot say"],
 answer:0,
 explanation:"Cats are included in animals and animals are included in living beings. Therefore the conclusion follows."
},
{
 subject:"Reasoning",
 category:"Syllogism",
 difficulty:"Medium",
 question:"All pens are tools. Some tools are expensive. Therefore some pens are expensive.",
 options:["Follows","Does not follow","Both","None"],
 answer:1,
 explanation:"The expensive tools need not be pens. Therefore the conclusion does not necessarily follow."
},
{
 subject:"Reasoning",
 category:"Clock & Calendar",
 difficulty:"Easy",
 question:"What is the angle between the hands of a clock at 3:00?",
 options:["0°","60°","90°","120°"],
 answer:2,
 explanation:"At 3:00 the minute hand is at 12 and the hour hand is at 3, giving an angle of 90°."
},
{
 subject:"Reasoning",
 category:"Clock & Calendar",
 difficulty:"Easy",
 question:"How many odd days are there in a normal year?",
 options:["0","1","2","3"],
 answer:1,
 explanation:"365 days = 52 complete weeks + 1 day. Therefore there is 1 odd day."
},
/* =========================
   ENGLISH
========================= */
{
 subject:"English",
 category:"Grammar",
 difficulty:"Easy",
 question:"Choose the correct sentence.",
 options:[
   "He do not like tea.",
   "He does not likes tea.",
   "He does not like tea.",
   "He don't likes tea."
 ],
 answer:2,
 explanation:"After 'does not', the main verb must be in its base form: 'does not like'."
},
{
 subject:"English",
 category:"Synonyms",
 difficulty:"Easy",
 question:"Choose the synonym of 'Abundant'.",
 options:["Scarce","Plentiful","Weak","Empty"],
 answer:1,
 explanation:"Abundant means available in large quantities. Plentiful has the same meaning."
},
{
 subject:"English",
 category:"Antonyms",
 difficulty:"Easy",
 question:"Choose the antonym of 'Ancient'.",
 options:["Old","Historic","Modern","Traditional"],
 answer:2,
 explanation:"Ancient means very old. Modern is its opposite."
},
{
 subject:"English",
 category:"Error Spotting",
 difficulty:"Medium",
 question:"Identify the incorrect part: 'She is senior than me.'",
 options:["She","is senior","than me","No error"],
 answer:2,
 explanation:"The correct expression is 'senior to me', not 'senior than me'."
},
{
 subject:"English",
 category:"Idioms",
 difficulty:"Easy",
 question:"What does 'A blessing in disguise' mean?",
 options:[
   "A hidden enemy",
   "Something that seems bad but turns out beneficial",
   "A religious ceremony",
   "A difficult situation"
 ],
 answer:1,
 explanation:"A blessing in disguise is something that initially appears bad but later proves beneficial."
},
{
 subject:"English",
 category:"Grammar",
 difficulty:"Medium",
 question:"Choose the correct sentence.",
 options:[
   "She have completed her work.",
   "She has completed her work.",
   "She having completed her work.",
   "She has complete her work."
 ],
 answer:1,
 explanation:"With the singular subject 'she', the present perfect uses 'has' + past participle: 'has completed'."
},
{
 subject:"English",
 category:"Articles",
 difficulty:"Easy",
 question:"He is ___ honest man.",
 options:["a","an","the","no article"],
 answer:1,
 explanation:"'Honest' begins with a vowel sound because the h is silent, so 'an' is used."
},
{
 subject:"English",
 category:"Prepositions",
 difficulty:"Easy",
 question:"She is good ___ mathematics.",
 options:["in","at","on","with"],
 answer:1,
 explanation:"The standard expression is 'good at' something."
},
{
 subject:"English",
 category:"Subject-Verb Agreement",
 difficulty:"Easy",
 question:"Neither Ravi nor his friends ___ present.",
 options:["was","is","were","has"],
 answer:2,
 explanation:"With 'neither...nor', the verb agrees with the nearer subject. 'Friends' is plural, so 'were' is correct."
},
{
 subject:"English",
 category:"Active & Passive Voice",
 difficulty:"Medium",
 question:"Change into passive voice: 'The police arrested the thief.'",
 options:[
   "The thief arrested the police.",
   "The thief was arrested by the police.",
   "The thief is arrested by police.",
   "The police was arrested by the thief."
 ],
 answer:1,
 explanation:"The object 'the thief' becomes the subject: 'The thief was arrested by the police.'"
},
{
 subject:"English",
 category:"Direct & Indirect Speech",
 difficulty:"Medium",
 question:"Change into indirect speech: He said, 'I am tired.'",
 options:[
   "He said that I am tired.",
   "He said that he was tired.",
   "He says that he was tired.",
   "He said that he is tired."
 ],
 answer:1,
 explanation:"In reported speech with a past reporting verb, 'am' changes to 'was' and 'I' changes to 'he'."
},
{
 subject:"English",
 category:"One Word Substitution",
 difficulty:"Easy",
 question:"One who cannot read or write is called:",
 options:["Illiterate","Literate","Scholar","Orator"],
 answer:0,
 explanation:"An illiterate person cannot read or write."
},
{
 subject:"English",
 category:"Synonyms",
 difficulty:"Easy",
 question:"Choose the synonym of 'Brief'.",
 options:["Long","Short","Heavy","Wide"],
 answer:1,
 explanation:"Brief means short in duration or length."
},
{
 subject:"English",
 category:"Antonyms",
 difficulty:"Easy",
 question:"Choose the antonym of 'Expand'.",
 options:["Increase","Extend","Contract","Enlarge"],
 answer:2,
 explanation:"Expand means to become larger; contract means to become smaller."
},
{
 subject:"English",
 category:"Spelling",
 difficulty:"Easy",
 question:"Choose the correctly spelt word.",
 options:["Accomodation","Accommodation","Acommodation","Accommadation"],
 answer:1,
 explanation:"The correct spelling is 'Accommodation'."
},
{
 subject:"English",
 category:"Sentence Improvement",
 difficulty:"Medium",
 question:"Improve the sentence: 'He is senior than me.'",
 options:[
   "He is senior to me.",
   "He is senior from me.",
   "He is more senior than me.",
   "He is senior with me."
 ],
 answer:0,
 explanation:"Senior is followed by the preposition 'to'. The standard form is 'senior to me'."
}
];
/* =====================================================
   APP VARIABLES
===================================================== */
let filteredQuestions = [];
let currentQuestion = 0;
let sessionCorrect = 0;
let sessionAttempted = 0;
/* =====================================================
   LOCAL STORAGE
===================================================== */
let totalAttempted =
  Number(localStorage.getItem("totalAttempted")) || 0;
let totalCorrect =
  Number(localStorage.getItem("totalCorrect")) || 0;
/* =====================================================
   TOPIC DROPDOWN
===================================================== */
function updateTopics() {
  const subject =
    document.getElementById("subject").value;
  const topicSelect =
    document.getElementById("topic");
  topicSelect.innerHTML =
    '<option value="All">All Topics</option>';
  const topics = [
    ...new Set(
      questions
        .filter(q => q.subject === subject)
        .map(q => q.category)
    )
  ];
  topics.sort();
  topics.forEach(topic => {
    const option =
      document.createElement("option");
    option.value = topic;
    option.textContent = topic;
    topicSelect.appendChild(option);
  });
}
document
  .getElementById("subject")
  .addEventListener("change", updateTopics);
/* =====================================================
   START PRACTICE
===================================================== */
function startPractice() {
  const subject =
    document.getElementById("subject").value;
  const topic =
    document.getElementById("topic").value;
  const difficulty =
    document.getElementById("difficulty").value;
  filteredQuestions =
    questions.filter(q => {
      if (q.subject !== subject)
        return false;
      if (topic !== "All" &&
          q.category !== topic)
        return false;
      if (difficulty !== "All" &&
          q.difficulty !== difficulty)
        return false;
      return true;
    });
  if (filteredQuestions.length === 0) {
    alert(
      "No questions available for this selection yet."
    );
    return;
  }
  /* Shuffle questions */
  filteredQuestions =
    shuffle([...filteredQuestions]);
  currentQuestion = 0;
  sessionCorrect = 0;
  sessionAttempted = 0;
  document
    .getElementById("home")
    .classList.add("hidden");
  document
    .getElementById("result")
    .classList.add("hidden");
  document
    .getElementById("quiz")
    .classList.remove("hidden");
  showQuestion();
}
/* =====================================================
   SHOW QUESTION
===================================================== */
function showQuestion() {
  const q =
    filteredQuestions[currentQuestion];
  document.getElementById("badge").textContent =
    q.subject + " • " +
    q.category + " • " +
    q.difficulty;
  document.getElementById("progressText").textContent =
    "Question " +
    (currentQuestion + 1) +
    " of " +
    filteredQuestions.length;
  const percentage =
    ((currentQuestion) /
      filteredQuestions.length) * 100;
  document.getElementById("progressBar").style.width =
    percentage + "%";
  document.getElementById("question").textContent =
    q.question;
  const optionsContainer =
    document.getElementById("options");
  optionsContainer.innerHTML = "";
  document
    .getElementById("explanation")
    .classList.add("hidden");
  document
    .getElementById("nextButton")
    .classList.add("hidden");
  q.options.forEach((option, index) => {
    const button =
      document.createElement("button");
    button.textContent =
      String.fromCharCode(65 + index) +
      ". " +
      option;
    button.className = "option";
    button.onclick =
      () => checkAnswer(index, button);
    optionsContainer.appendChild(button);
  });
}
/* =====================================================
   CHECK ANSWER
===================================================== */
function checkAnswer(
  selected,
  selectedButton
) {
  const q =
    filteredQuestions[currentQuestion];
  const buttons =
    document.querySelectorAll(
      "#options button"
    );
  buttons.forEach(button => {
    button.disabled = true;
  });
  sessionAttempted++;
  totalAttempted++;
  if (selected === q.answer) {
    sessionCorrect++;
    totalCorrect++;
    selectedButton.classList.add("correct");
  } else {
    selectedButton.classList.add("wrong");
    buttons[q.answer]
      .classList.add("correct");
  }
  localStorage.setItem(
    "totalAttempted",
    totalAttempted
  );
  localStorage.setItem(
    "totalCorrect",
    totalCorrect
  );
  document.getElementById(
    "explanation"
  ).innerHTML =
    "<strong>Explanation:</strong><br>" +
    q.explanation;
  document
    .getElementById("explanation")
    .classList.remove("hidden");
  document
    .getElementById("nextButton")
    .classList.remove("hidden");
  updateProgress();
}
/* =====================================================
   NEXT QUESTION
===================================================== */
function nextQuestion() {
  currentQuestion++;
  if (
    currentQuestion >=
    filteredQuestions.length
  ) {
    showResult();
    return;
  }
  showQuestion();
}
/* =====================================================
   RESULT
===================================================== */
function showResult() {
  document
    .getElementById("quiz")
    .classList.add("hidden");
  document
    .getElementById("result")
    .classList.remove("hidden");
  const accuracy =
    sessionAttempted === 0
      ? 0
      : Math.round(
          sessionCorrect /
          sessionAttempted *
          100
        );
  document.getElementById(
    "resultTotal"
  ).textContent =
    sessionAttempted;
  document.getElementById(
    "resultCorrect"
  ).textContent =
    sessionCorrect;
  document.getElementById(
    "resultAccuracy"
  ).textContent =
    accuracy + "%";
  let message;
  if (accuracy >= 90) {
    message = "Excellent! 🏆";
  } else if (accuracy >= 75) {
    message = "Very good! Keep improving. 🔥";
  } else if (accuracy >= 50) {
    message = "Good attempt. Practice more. 💪";
  } else {
    message = "Keep practising. You can improve! 📚";
  }
  document.getElementById(
    "resultMessage"
  ).textContent =
    message;
}
/* =====================================================
   GO HOME
===================================================== */
function goHome() {
  document
    .getElementById("quiz")
    .classList.add("hidden");
  document
    .getElementById("result")
    .classList.add("hidden");
  document
    .getElementById("home")
    .classList.remove("hidden");
  updateProgress();
}
/* =====================================================
   PROGRESS
===================================================== */
function updateProgress() {
  document.getElementById(
    "attempted"
  ).textContent =
    totalAttempted;
  document.getElementById(
    "correct"
  ).textContent =
    totalCorrect;
  const accuracy =
    totalAttempted === 0
      ? 0
      : Math.round(
          totalCorrect /
          totalAttempted *
          100
        );
  document.getElementById(
    "accuracy"
  ).textContent =
    accuracy + "%";
}
/* =====================================================
   RESET
===================================================== */
function resetProgress() {
  const confirmReset =
    confirm(
      "Are you sure you want to reset all progress?"
    );
  if (!confirmReset)
    return;
  totalAttempted = 0;
  totalCorrect = 0;
  localStorage.removeItem("totalAttempted");
  localStorage.removeItem("totalCorrect");
  updateProgress();
}
/* =====================================================
   SHUFFLE
===================================================== */
function shuffle(array) {
  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {
    const j =
      Math.floor(
        Math.random() * (i + 1)
      );
    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];
  }
  return array;
}
/* =====================================================
   INITIALIZE
===================================================== */
updateTopics();
updateProgress();
</script>
</body>
</html>
